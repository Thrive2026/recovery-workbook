<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recovery Workbook · Thrive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --paper:#F3F5F1;
    --panel:#FFFFFF;
    --ink:#2B3A3A;
    --ink-soft:#5B6B67;
    --line:#DDE3DD;
    --l1:#7FA88F; --l1-bg:#EAF2ED;
    --l2:#C9A24B; --l2-bg:#FBF3E1;
    --l3:#D98B3F; --l3-bg:#FCEEDE;
    --l4:#C0604A; --l4-bg:#FBE7E2;
    --l5:#A63D33; --l5-bg:#F7DEDB;
    --sud:#7FA88F;  --sud-bg:#EAF2ED;
    --mh:#6E86C9;   --mh-bg:#E9EDF8;
    --co:#B37FAE;   --co-bg:#F3E9F1;
    --good:#4C8B6E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Public Sans',sans-serif; line-height:1.5;
    padding:0 0 80px;
    min-height:100vh;
  }
  .wrap{max-width:820px; margin:0 auto; padding:24px 16px 40px;}
  h1,h2,h3,h4{font-family:'Source Serif 4',serif; font-weight:700; margin:0;}
  a{color:inherit;}
  button{font-family:inherit;}
  .hidden{display:none !important;}

  /* ---------- top bar ---------- */
  .topbar{
    background:var(--panel); border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:40;
  }
  .topbar-inner{
    max-width:820px; margin:0 auto; padding:12px 16px;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:9px; font-family:'Source Serif 4',serif; font-weight:700; font-size:16px; cursor:pointer;}
  .brand .mark{width:34px; height:34px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .brand .mark svg{width:18px; height:18px;}
  .brand .brand-text{display:flex; flex-direction:column; line-height:1.15;}
  .brand .brand-text .b-thrive{font-size:15.5px;}
  .brand .brand-text .b-sub{font-family:'Public Sans',sans-serif; font-weight:600; font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft);}

  /* ---------- site footer / trademark line ---------- */
  .site-footer{max-width:820px; margin:36px auto 0; padding:18px 16px 0; border-top:1px solid var(--line); display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center; text-align:center;}
  .site-footer .foot-mark{width:22px; height:22px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .site-footer .foot-mark svg{width:12px; height:12px;}
  .site-footer p{margin:0; font-size:11.5px; color:var(--ink-soft);}

  /* ---------- foundation bricks (fun progress metaphor) ---------- */
  .foundation-wrap{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:12px;}
  .foundation-wrap .f-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-bottom:8px;}
  .foundation-bricks{display:flex; flex-direction:column-reverse; gap:4px;}
  .f-brick{height:16px; border-radius:4px; background:var(--paper); border:1.5px dashed var(--line); transition:background .3s, border-color .3s;}
  .f-brick.laid{background:var(--good); border:1.5px solid var(--good); border-style:solid;}
  .f-brick .f-tag{display:none;}
  .topbar-spacer{flex:1;}
  .save-indicator{font-size:12.5px; color:var(--ink-soft); display:flex; align-items:center; gap:6px;}
  .save-dot{width:7px; height:7px; border-radius:50%; background:var(--line);}
  .save-dot.saving{background:var(--l2); animation:pulse 1s infinite;}
  .save-dot.saved{background:var(--good);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .provider-chip{font-size:13px; color:var(--ink-soft); display:flex; align-items:center; gap:8px;}
  .btn{
    display:inline-flex; align-items:center; gap:7px; border:none;
    padding:9px 16px; border-radius:8px; font-weight:600; font-size:13.5px; cursor:pointer;
    white-space:nowrap;
  }
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-primary:disabled{opacity:.55; cursor:default;}
  .btn-ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink);}
  .btn-sm{padding:6px 12px; font-size:12.5px;}
  .btn-danger{background:transparent; color:var(--l4); border:1.5px solid var(--l4-bg);}

  /* crisis strip */
  .crisis-strip{background:var(--l5-bg); border-bottom:1px solid var(--l5);}
  .crisis-inner{max-width:820px; margin:0 auto; padding:8px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:12.5px; color:var(--l5);}
  .crisis-inner b{font-weight:700;}
  .crisis-inner .cchip{background:#fff; border-radius:20px; padding:3px 10px; border:1px solid var(--l5);}
  .crisis-toggle{margin-left:auto; background:none; border:none; color:var(--l5); font-size:12px; cursor:pointer; text-decoration:underline; font-weight:600;}

  /* ---------- login ---------- */
  .center-screen{min-height:80vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .login-card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:36px 32px; max-width:400px; width:100%;}
  .login-card .eyebrow{font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); font-weight:600;}
  .login-card h1{font-size:28px; margin:6px 0 6px;}
  .login-card p.sub{color:var(--ink-soft); font-size:14px; margin:0 0 22px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; font-weight:600; margin-bottom:5px;}
  .field input{width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px; font-family:inherit; font-size:14.5px; background:#fdfdfc;}
  .field input:focus{outline:none; border-color:var(--ink);}
  .login-error{background:var(--l5-bg); color:var(--l5); font-size:13px; padding:9px 12px; border-radius:8px; margin-bottom:14px;}
  .login-note{font-size:12px; color:var(--ink-soft); margin-top:16px; text-align:center;}
  .config-warn{background:var(--l2-bg); color:#7a5a12; font-size:12.5px; padding:10px 12px; border-radius:8px; margin-bottom:16px; line-height:1.5;}

  /* ---------- dashboard ---------- */
  .eyebrow{font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); font-weight:600;}
  .page-head{margin:8px 0 22px; display:flex; align-items:flex-end; justify-content:space-between; gap:14px; flex-wrap:wrap;}
  .page-head h1{font-size:30px;}
  .search-row{display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap;}
  .search-row input{flex:1; min-width:180px; padding:10px 14px; border:1.5px solid var(--line); border-radius:8px; font-family:inherit; font-size:14.5px; background:var(--panel);}
  .search-row input:focus{outline:none; border-color:var(--ink);}
  .client-list{display:flex; flex-direction:column; gap:10px;}
  .client-card{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; display:flex; align-items:center; gap:14px; cursor:pointer; transition:border-color .15s;
  }
  .client-card:hover{border-color:var(--ink);}
  .client-avatar{width:38px; height:38px; border-radius:50%; background:var(--l1-bg); color:var(--l1); display:flex; align-items:center; justify-content:center; font-weight:700; font-family:'Source Serif 4',serif; flex-shrink:0;}
  .client-main{flex:1; min-width:0;}
  .client-main .name{font-weight:700; font-size:15px;}
  .client-main .meta{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .track-pills{display:flex; gap:6px; flex-wrap:wrap;}
  .pill{font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap;}
  .pill-sud{background:var(--sud-bg); color:var(--sud);}
  .pill-mh{background:var(--mh-bg); color:var(--mh);}
  .pill-co{background:var(--co-bg); color:var(--co);}
  .empty-state{text-align:center; padding:50px 20px; color:var(--ink-soft);}
  .empty-state .big{font-size:38px; margin-bottom:8px;}

  /* modal */
  .modal-overlay{position:fixed; inset:0; background:rgba(43,58,58,.45); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
  .modal{background:var(--panel); border-radius:14px; padding:26px 26px 22px; max-width:420px; width:100%;}
  .modal h3{font-size:19px; margin-bottom:14px;}
  .modal .btn-row{display:flex; gap:10px; justify-content:flex-end; margin-top:18px;}

  /* ---------- track picker ---------- */
  .track-grid{display:grid; grid-template-columns:1fr; gap:14px; margin-top:18px;}
  @media(min-width:640px){.track-grid{grid-template-columns:repeat(3,1fr);}}
  .track-card{border:2px solid var(--line); border-radius:14px; padding:20px 18px; cursor:pointer; background:var(--panel); transition:transform .1s, border-color .15s;}
  .track-card:hover{transform:translateY(-2px);}
  .track-card.sud{border-color:var(--sud);}
  .track-card.mh{border-color:var(--mh);}
  .track-card.co{border-color:var(--co);}
  .track-card.res{border-color:var(--l2);}
  .track-card.care{border-color:var(--mh);}
  .track-card .ic{width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:20px; margin-bottom:10px;}
  .track-card.sud .ic{background:var(--sud-bg);}
  .track-card.mh .ic{background:var(--mh-bg);}
  .track-card.co .ic{background:var(--co-bg);}
  .track-card h4{font-size:16px; margin-bottom:6px;}
  .track-card p{font-size:13px; color:var(--ink-soft); margin:0;}

  /* ---------- workbook layout ---------- */
  .wb-layout{display:flex; gap:22px; align-items:flex-start;}
  .wb-sidebar{width:220px; flex-shrink:0; position:sticky; top:70px;}
  @media(max-width:760px){.wb-layout{flex-direction:column;} .wb-sidebar{width:100%; position:static;}}
  .wb-main{flex:1; min-width:0;}

  .progress-ring-wrap{display:flex; align-items:center; gap:10px; margin-bottom:16px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px;}
  .progress-ring-wrap svg{flex-shrink:0;}
  .progress-ring-wrap .pct{font-family:'Source Serif 4',serif; font-weight:700; font-size:15px;}
  .progress-ring-wrap .lbl{font-size:11.5px; color:var(--ink-soft);}

  .chapter-nav{display:flex; flex-direction:column; gap:6px;}
  .chapter-nav button{
    text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; cursor:pointer; font-size:13.5px; font-weight:600; color:var(--ink-soft);
    display:flex; align-items:center; gap:8px;
  }
  .chapter-nav button.active{border-color:var(--ink); color:var(--ink); background:#fff;}
  .chapter-nav .chk{width:18px; height:18px; border-radius:50%; border:2px solid var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:10px;}
  .chapter-nav button.done .chk{background:var(--good); border-color:var(--good); color:#fff;}
  .wb-tools{margin-top:14px; display:flex; flex-direction:column; gap:6px;}

  .chapter-head{margin-bottom:20px;}
  .chapter-head .num{font-family:'Source Serif 4',serif; font-weight:700; font-size:13px; color:var(--ink-soft);}
  .chapter-head h2{font-size:26px; margin:2px 0 4px;}
  .chapter-head .subtitle{color:var(--ink-soft); font-size:14.5px;}

  .intro-block{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px 22px; margin-bottom:18px;}
  .intro-block p{font-size:14.5px; margin:0 0 12px;}
  .intro-block p:last-child{margin-bottom:0;}
  .quote-block{border-left:3px solid var(--ink); padding-left:14px; margin:14px 0; font-style:italic; font-family:'Source Serif 4',serif; font-size:16px;}
  .quote-block .by{display:block; font-style:normal; font-family:'Public Sans',sans-serif; font-size:12.5px; color:var(--ink-soft); margin-top:4px;}
  .principles{margin:12px 0 0; padding-left:0; list-style:none; display:flex; flex-direction:column; gap:8px;}
  .principles li{display:flex; gap:10px; font-size:14px; align-items:flex-start;}
  .principles li .n{flex-shrink:0; width:22px; height:22px; border-radius:50%; background:var(--l1-bg); color:var(--l1); font-size:11.5px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px;}

  .prompt-block{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px 22px; margin-bottom:16px;}
  .prompt-block .p-label{font-weight:700; font-size:15px; margin-bottom:4px; display:flex; align-items:center; gap:8px;}
  .prompt-block .p-hint{font-size:13px; color:var(--ink-soft); font-style:italic; margin-bottom:12px;}
  .speak-btn{background:var(--paper); border:1px solid var(--line); border-radius:20px; width:26px; height:26px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; font-size:12px; flex-shrink:0;}
  .speak-btn:hover{border-color:var(--ink);}
  textarea.answer{width:100%; border:1.5px solid var(--line); border-radius:10px; padding:12px 14px; font-family:inherit; font-size:14.5px; min-height:90px; resize:vertical; background:#fdfdfc; color:var(--ink);}
  textarea.answer:focus, input.answer:focus{outline:none; border-color:var(--ink);}
  input.answer{width:100%; border:1.5px solid var(--line); border-radius:8px; padding:9px 12px; font-family:inherit; font-size:14.5px; background:#fdfdfc;}
  .char-hint{font-size:11.5px; color:var(--ink-soft); margin-top:5px; text-align:right;}

  .list-rows{display:flex; flex-direction:column; gap:8px;}
  .list-row{display:flex; align-items:center; gap:10px;}
  .list-row .idx{flex-shrink:0; width:22px; height:22px; border-radius:50%; background:var(--paper); color:var(--ink-soft); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center;}

  .contact-row{display:grid; grid-template-columns:2fr 1.3fr; gap:8px; margin-bottom:8px;}

  .checklist-item{display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-top:1px solid var(--line);}
  .checklist-item:first-child{border-top:none;}
  .checklist-item input[type=checkbox]{margin-top:3px; width:17px; height:17px; accent-color:var(--good); flex-shrink:0;}
  .checklist-item label{font-size:14px;}

  .goal-timeframe{margin-bottom:18px;}
  .goal-timeframe h4{font-size:15px; margin-bottom:8px; color:var(--ink);}
  .goal-block{background:var(--paper); border-radius:10px; padding:14px 16px; margin-bottom:10px;}
  .goal-block label{display:block; font-size:12.5px; font-weight:700; margin:0 0 4px;}
  .goal-block .gfield{margin-bottom:10px;}
  .goal-block .gfield:last-child{margin-bottom:0;}
  .goal-block textarea{min-height:44px;}

  .section-divider{display:flex; align-items:center; gap:12px; margin:26px 0 14px;}
  .section-divider .line-el{flex:1; height:1px; background:var(--line);}
  .section-divider h3{font-size:15px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em; font-weight:700; white-space:nowrap;}

  .chapter-footer{display:flex; justify-content:space-between; gap:12px; margin-top:24px; flex-wrap:wrap;}

  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:20px; font-size:13.5px; z-index:200; box-shadow:0 4px 20px rgba(0,0,0,.2);}

  /* ---------- my resources page ---------- */
  .res-card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:12px;}
  .res-card-cat{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft); margin-bottom:10px;}
  .res-item{display:flex; align-items:flex-start; gap:12px; padding:11px 0; border-top:1px solid var(--line);}
  .res-item:first-child{border-top:none;}
  .res-item input[type=checkbox]{margin-top:4px; width:16px; height:16px; accent-color:var(--good); flex-shrink:0;}
  .res-item-main{flex:1; min-width:0;}
  .res-item-main .rname{font-weight:700; font-size:14.5px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .res-item-main .rdesc{font-size:13px; color:var(--ink-soft); margin-top:3px;}
  .res-call-btn{display:inline-flex; align-items:center; gap:5px; background:var(--l1-bg); color:var(--l1); border-radius:20px; padding:3px 11px; font-size:12.5px; font-weight:700; text-decoration:none; flex-shrink:0;}
  .res-card.crisis .res-call-btn{background:var(--l5-bg); color:var(--l5);}
  .res-card.safety .res-call-btn{background:var(--l4-bg); color:var(--l4);}

  .people-row{background:var(--paper); border-radius:10px; padding:12px 14px; margin-bottom:10px; display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:8px; align-items:start;}
  @media(max-width:640px){.people-row{grid-template-columns:1fr;}}
  .people-row select{width:100%; padding:9px 10px; border:1.5px solid var(--line); border-radius:8px; font-family:inherit; font-size:13.5px; background:#fdfdfc; color:var(--ink);}
  .people-row select:focus{outline:none; border-color:var(--ink);}
  .people-row .remove-person{grid-column:1 / -1; justify-self:flex-end; background:none; border:none; color:var(--ink-soft); font-size:12px; cursor:pointer; text-decoration:underline; padding:2px;}
  .add-person-btn{width:100%; border:1.5px dashed var(--line); background:transparent; border-radius:10px; padding:11px; font-weight:600; font-size:13.5px; color:var(--ink-soft); cursor:pointer;}
  .add-person-btn:hover{border-color:var(--ink); color:var(--ink);}
  .care-row{background:var(--paper); border-radius:10px; padding:12px 14px; margin-bottom:10px; display:grid; grid-template-columns:1.1fr 1.3fr 1fr 1.4fr; gap:8px; align-items:start;}
  @media(max-width:760px){.care-row{grid-template-columns:1fr;}}
  .care-row select{width:100%; padding:9px 10px; border:1.5px solid var(--line); border-radius:8px; font-family:inherit; font-size:13.5px; background:#fdfdfc; color:var(--ink);}
  .care-row select:focus{outline:none; border-color:var(--ink);}
  .care-row .remove-person{grid-column:1 / -1; justify-self:flex-end; background:none; border:none; color:var(--ink-soft); font-size:12px; cursor:pointer; text-decoration:underline; padding:2px;}
  .thennow-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:640px){.thennow-grid{grid-template-columns:1fr;}}
  @keyframes breatheScale{
    0%{transform:scale(.6);} 25%{transform:scale(1);} 50%{transform:scale(1);} 75%{transform:scale(.6);} 100%{transform:scale(.6);}
  }
  .breathe-circle{width:120px; height:120px; border-radius:50%; background:var(--sud-bg); border:2px solid var(--sud); margin:14px auto; animation:breatheScale 16s ease-in-out infinite;}
  .breathe-label{font-weight:700; color:var(--sud); font-size:13px; text-align:center; margin-top:6px;}
  @media print{
    .topbar,.crisis-strip,.wb-sidebar,.wb-tools,.chapter-footer,.chapter-nav{display:none !important;}
    body{padding:0;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-host"></div>
<script>
/* =========================================================================
   THRIVE LOGO — embedded as base64 so the app stays a single portable file.
   Source: Thrive_Vertical_Logo.png. LOGO_ICON_SRC is the hand+leaves mark
   cropped square-ish for small badges (topbar, footer, login badge).
   LOGO_FULL_SRC is the full vertical lockup (mark + wordmark) for the login

const app = document.getElementById('app');

function toast(msg, ms){
  const host = document.getElementById('toast-host');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  host.innerHTML = '';
  host.appendChild(el);
  setTimeout(()=>{ el.remove(); }, ms || 2600);
}

function esc(s){
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function initials(label){
  if (!label) return '?';
  const clean = label.trim().replace(/[^a-zA-Z0-9]/g, '');
  return (clean.slice(0, 2) || '?').toUpperCase();
}

function speak(text){
  if (!('speechSynthesis' in window)) { toast('Read-aloud isn\'t supported in this browser.'); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}

  </div>`;
}

<script>

  return `

  </div>`;
}

function foundationBricksHTML(){
  const track = TRACKS[STATE.currentTrackKey];
  if (!track) return '';
  const bricks = track.chapters.map(ch => {
    const p = computeChapterProgress(ch);
    const laid = p.total > 0 && p.completed === p.total;
    return `<div class="f-brick ${laid ? 'laid' : ''}" title="Chapter ${ch.num}: ${esc(ch.title)}"></div>`;
  });
  return `
  <div class="foundation-wrap">
    <div class="f-label">Building the foundation</div>
    <div class="foundation-bricks">${bricks.join('')}</div>
  </div>`;
}

  opts = opts || {};
  const saveHTML = opts.showSave ? `
    <div class="save-indicator">
      <span class="save-dot ${STATE.saveState === 'saving' ? 'saving' : (STATE.saveState === 'saved' ? 'saved' : '')}"></span>
      <span id="save-label">${STATE.saveState === 'saving' ? 'Saving…' : (STATE.saveState === 'saved' ? 'Saved' : 'Autosaves as you go')}</span>
    </div>` : '';
  return `
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand" onclick="goToDashboard()">
        <div class="mark">${logoIconSVG()}</div>
        <div class="brand-text">

function render(){
  // Any page can leave the breathing widget's interval running behind it —
  // clearing it here, on every render, guarantees it never leaks regardless
  // of which button/link the person used to navigate away.
  stopBreathing();

  if (!CONFIGURED){
    renderConfigWarning();
    return;
  }
  if (!STATE.session){
    renderLogin();

  if (STATE.viewerRole === 'client'){
    // Clients only ever see their own record — no dashboard, no client switcher.
    if (!STATE.currentTrackKey) renderTrackPicker();
    else if (STATE.currentTrackKey === 'resources') renderResourcesPage();
    else if (STATE.currentTrackKey === 'careteam') renderCareTeamPage();
    else if (STATE.currentTrackKey === 'checkin') renderCheckinPage();
    else if (STATE.currentTrackKey === 'visitprep') renderVisitPrepPage();
    else if (STATE.currentTrackKey === 'toolbox') renderToolboxPage();
    else if (STATE.currentTrackKey === 'exposure') renderExposurePage();
    else if (STATE.wbTool === 'thennow') renderThenNowPage();
    else if (STATE.wbTool === 'letter') renderLetterPage();
    else renderWorkbook();
    return;
  }
  if (!STATE.currentClient){
    renderDashboard();
  } else if (!STATE.currentTrackKey){
    renderTrackPicker();
  } else if (STATE.currentTrackKey === 'resources'){
    renderResourcesPage();
  } else if (STATE.currentTrackKey === 'careteam'){
    renderCareTeamPage();
  } else if (STATE.currentTrackKey === 'checkin'){
    renderCheckinPage();
  } else if (STATE.currentTrackKey === 'visitprep'){
    renderVisitPrepPage();
  } else if (STATE.currentTrackKey === 'toolbox'){
    renderToolboxPage();
  } else if (STATE.currentTrackKey === 'exposure'){
    renderExposurePage();
  } else if (STATE.wbTool === 'thennow'){
    renderThenNowPage();
  } else if (STATE.wbTool === 'letter'){
    renderLetterPage();
  } else {
    renderWorkbook();
  }
}

<script>
/* =========================================================================
   LOGIN (providers only — clients never get an account)
   ========================================================================= */
function renderLogin(){
  const year = new Date().getFullYear();
  app.innerHTML = `
  <div class="center-screen">
    <div class="login-card">
      <div style="width:150px; margin:0 auto 18px;">${logoFullImg()}</div>
      <div class="eyebrow" style="text-align:center;">Recovery Workbook · Sign In</div>
      <h1 style="text-align:center;">Welcome back</h1>
      <p class="sub" style="text-align:center;">Staff, sign in with your Thrive account. Clients, use the login your provider set up for you.</p>
      <div id="login-error"></div>
      <div class="field">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" placeholder="you@thrivepeer.org" autocomplete="username">
      </div>
      <div class="field">
        <label for="login-pass">Password</label>
        <input id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" style="width:100%; justify-content:center;" id="login-btn" onclick="doSignIn()">Sign in</button>
      <p class="login-note">Forgot your password? Ask your provider (or a supervisor, for staff) to reset it in Supabase.</p>
      <p class="login-note" style="margin-top:20px; opacity:.7;">&copy; ${year} Thrive Peer Support Services. All rights reserved.</p>
    </div>
  </div>`;
  document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doSignIn(); });
}

async function doSignIn(){
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const errHost = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  errHost.innerHTML = '';
  if (!email || !pass){ errHost.innerHTML = `<div class="login-error">Enter your email and password.</div>`; return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if (error) throw error;
    STATE.session = data.session;
    await resolveViewerRole();
    render();
  } catch (err){
    errHost.innerHTML = `<div class="login-error">${esc(err.message || 'Could not sign in. Check your email and password.')}</div>`;
    btn.disabled = false; btn.textContent = 'Sign in';
  }
}

async function doSignOut(){
  await sb.auth.signOut();
  STATE.session = null;
  STATE.viewerRole = null;
  STATE.providerName = '';
  STATE.providerEmail = '';
  STATE.clients = [];
  STATE.currentClient = null;
  STATE.currentTrackKey = null;
  render();
}

// Figures out whether the signed-in account is a provider or a client, and
// loads whatever that role needs. Order matters: a `providers` row always
// wins (staff), then `client_logins` (a client's own account). If neither
// exists, this is a brand-new staff account created directly in Supabase —
// provision it as a provider, same as before.
//
// Each Supabase call below checks its `error` explicitly rather than only
// looking at `data`. A permission/grants problem comes back as an error
// with data:null — same shape as "no row found" — so ignoring the error
// used to let the code silently fall through to "this must be a brand-new
// account" and create a half-correct local session with no real row behind
// it. Surfacing the error instead stops that from happening quietly again.
async function resolveViewerRole(){
  const uid = STATE.session.user.id;

  const { data: providerRow, error: providerErr } = await sb.from('providers').select('full_name, email').eq('id', uid).maybeSingle();
  if (providerErr){
    toast('Could not load your account: ' + providerErr.message);
    return;
  }
  if (providerRow){
    STATE.viewerRole = 'provider';
    STATE.providerName = providerRow.full_name;
    STATE.providerEmail = providerRow.email || STATE.session.user.email;
    await loadClients();
    return;
  }

  const { data: clientRow, error: clientErr } = await sb.from('client_logins').select('client_id').eq('id', uid).maybeSingle();
  if (clientErr){
    toast('Could not load your account: ' + clientErr.message);
    return;
  }
  if (clientRow){
    STATE.viewerRole = 'client';
    const { data: clientData } = await sb.from('clients').select('id, full_name, county').eq('id', clientRow.client_id).maybeSingle();
    if (clientData){
      const { data: progressRows } = await sb.from('workbook_progress').select('track, completed_prompts, total_prompts, updated_at').eq('client_id', clientData.id);
      clientData.workbook_progress = progressRows || [];
      STATE.currentClient = clientData;
    }
    return;
  }

  // Neither record exists yet — first-ever sign-in for a staff account added
  // directly in the Supabase dashboard.
  STATE.viewerRole = 'provider';
  const fallbackName = STATE.session.user.email.split('@')[0];
  const { error: upsertErr } = await sb.from('providers').upsert({ id: uid, full_name: fallbackName, email: STATE.session.user.email });
  if (upsertErr){
    toast('Could not set up your provider account: ' + upsertErr.message);
    STATE.viewerRole = null;
    return;
  }
  STATE.providerName = fallbackName;
  STATE.providerEmail = STATE.session.user.email;
  await loadClients();
}
</script>
<script>
/* =========================================================================
   DASHBOARD — pick or create a client
   ========================================================================= */
async function loadClients(){
  const { data, error } = await sb
    .from('clients')
    .select('id, full_name, county, created_at, workbook_progress(track, completed_prompts, total_prompts, updated_at)')
    .eq('archived', false)
    .order('created_at', { ascending: false });
  if (error){ toast('Could not load clients: ' + error.message); return; }
  STATE.clients = data || [];
}

function trackPillsForClient(client){
  const progress = client.workbook_progress || [];
  if (!progress.length) return `<span style="font-size:12px; color:var(--ink-soft);">No workbook started yet</span>`;
  return progress.map(p => {
    if (p.track === 'resources'){
      return `<span class="pill" style="background:var(--l2-bg); color:#7a5a12;">📋 Resources</span>`;
    }
    if (p.track === 'careteam'){
      return `<span class="pill" style="background:var(--mh-bg); color:var(--mh);">🩺 Care Team</span>`;
    }
    if (p.track === 'checkin'){
      return `<span class="pill" style="background:var(--sud-bg); color:var(--sud);">📊 Check-In</span>`;
    }
    if (p.track === 'visitprep'){
      return `<span class="pill" style="background:var(--co-bg); color:var(--co);">📋 Visit Prep</span>`;
    }
    if (p.track === 'toolbox'){
      return `<span class="pill" style="background:var(--l1-bg); color:var(--l1);">🧰 Toolbox</span>`;
    }
    if (p.track === 'exposure'){
      return `<span class="pill" style="background:var(--mh-bg); color:var(--mh);">🪜 Anxiety Ladder</span>`;
    }
    const t = TRACKS[p.track];
    if (!t) return '';
    const pct = p.total_prompts ? Math.round(100 * p.completed_prompts / p.total_prompts) : 0;
    return `<span class="pill pill-${t.cls === 'sud' ? 'sud' : (t.cls === 'mh' ? 'mh' : 'co')}">${esc(t.short)} · ${pct}%</span>`;
  }).join('');
}

function renderDashboard(filter){
  filter = (filter || '').toLowerCase();
  const list = STATE.clients.filter(c => c.full_name.toLowerCase().includes(filter));
  app.innerHTML = `
    ${topbarHTML({})}
    <div class="wrap">
      <div class="page-head">
        <div>
          <div class="eyebrow">Your clients</div>
          <h1>Recovery Workbook</h1>
        </div>
        <button class="btn btn-primary" onclick="openAddClientModal()">+ New client</button>
      </div>
      <div class="search-row">
        <input id="client-search" type="text" placeholder="Search by client number…" value="${esc(filter)}" oninput="renderDashboard(this.value)">
      </div>
      <div class="client-list">
        ${list.length ? list.map(c => `
          <div class="client-card" onclick="openClient('${c.id}')">
            <div class="client-avatar">${esc(initials(c.full_name))}</div>
            <div class="client-main">
              <div class="name">${esc(c.full_name)}</div>
              <div class="meta">${c.county ? esc(c.county) + ' County · ' : ''}Added ${new Date(c.created_at).toLocaleDateString()}</div>
            </div>
            <div class="track-pills">${trackPillsForClient(c)}</div>
          </div>
        `).join('') : `
          <div class="empty-state">
            <div class="big">🧱</div>
            <p>${STATE.clients.length ? 'No clients match that search.' : 'No clients yet — add your first one and help them start building their foundation.'}</p>
          </div>
        `}
      </div>
    </div>
    ${siteFooterHTML()}`;
  const s = document.getElementById('client-search');
  if (s){ s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
}

function suggestNextClientNumber(){
  const nums = STATE.clients
    .map(c => (c.full_name.match(/^C-(\d+)$/) || [])[1])
    .filter(Boolean)
    .map(Number);
  const next = nums.length ? Math.max(...nums) + 1 : 1;
  return 'C-' + String(next).padStart(4, '0');
}

function openAddClientModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>New client</h3>
      <div class="field">
        <label for="new-client-name">Client number</label>
        <input id="new-client-name" type="text" placeholder="e.g. C-0001, or your own MRN/PIMSY ID" value="${esc(suggestNextClientNumber())}">
      </div>
      <div class="field">
        <label for="new-client-county">County (optional, can set later)</label>
        <select id="new-client-county">
          <option value="">Not set</option>
          ${OHIO_COUNTIES.map(c => `<option value="${esc(c)}">${esc(c)}${COUNTY_TO_REGION[c] ? ' ✓ has local listings' : ''}</option>`).join('')}
        </select>
      </div>
      <p style="font-size:12.5px; color:var(--ink-soft); margin:0;">No client names go in this app — use a client number, MRN, or PIMSY ID instead so nothing identifying shows on screen. Clients don't get a login by default; their workbook is tied to this number so any provider on their team can pick it back up. County drives which local resources show up on their My Resources page.</p>
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="createClient()">Add client</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const input = document.getElementById('new-client-name');
  input.focus();
  input.select();
  input.addEventListener('keydown', e => { if (e.key === 'Enter') createClient(); });
}

function closeModal(){
  const m = document.getElementById('modal-overlay');
  if (m) m.remove();
}

async function createClient(){
  const name = document.getElementById('new-client-name').value.trim();
  const county = document.getElementById('new-client-county').value || null;
  if (!name){ toast('Enter a client number first.'); return; }
  // Goes through the create_client() RPC (a SECURITY DEFINER function) rather
  // than a raw table insert. A raw insert here was consistently rejected by
  // Supabase's RLS enforcement on this project even with a wide-open policy
  // (with check (true)) and correct grants/data — confirmed not a schema
  // issue on our end. Routing the write through a SECURITY DEFINER function
  // sidesteps whatever that platform-level quirk is; the function still
  // enforces the "must be a registered provider" rule itself internally.
  const { data, error } = await sb.rpc('create_client', { p_full_name: name, p_county: county });
  if (error){ toast('Could not add client: ' + error.message); return; }
  closeModal();
  await loadClients();
  openClient(data.id);
}

function openClient(clientId){
  STATE.currentClient = STATE.clients.find(c => c.id === clientId) || { id: clientId };
  STATE.currentTrackKey = null;
  render();
}
</script>

/* =========================================================================
   ACCESS PANEL (provider view only) — client login setup + who else can see

async function loadAndRenderAccessPanel(clientId){
  const [{ data: loginRow }, { data: accessRows }] = await Promise.all([
    sb.from('client_logins').select('id, email').eq('client_id', clientId).maybeSingle(),
    sb.from('client_provider_access').select('id, provider_email').eq('client_id', clientId).order('added_at')

}

function generateTempPassword(){
  const words = ['maple','harbor','ember','cedar','summit','willow','anchor','meadow','coral','birch','falcon','amber','cliff','plume','ridge'];
  const w = words[Math.floor(Math.random()*words.length)];

<script>
/* =========================================================================
   PROGRESS LOAD / SAVE (autosave, debounced)
   ========================================================================= */
async function loadProgress(){
  const { data, error } = await sb
    .from('workbook_progress')
    .select('data')
    .eq('client_id', STATE.currentClient.id)
    .eq('track', STATE.currentTrackKey)
    .maybeSingle();
  if (error){ toast('Could not load workbook: ' + error.message); STATE.formData = {}; return; }
  STATE.formData = (data && data.data) ? data.data : {};
}

function queueSave(){
  STATE.saveState = 'saving';
  updateSaveIndicator();
  if (STATE.saveTimer) clearTimeout(STATE.saveTimer);
  STATE.saveTimer = setTimeout(saveProgressNow, 1000);
}

async function saveProgressNow(){
  const { total, completed } = computeOverallProgress();
  // Routed through the save_workbook_progress() RPC — see createClient() for
  // why raw table writes are avoided here.
  const { error } = await sb.rpc('save_workbook_progress', {
    p_client_id: STATE.currentClient.id,
    p_track: STATE.currentTrackKey,
    p_data: STATE.formData,
    p_total: total,
    p_completed: completed
  });
  STATE.saveState = error ? 'idle' : 'saved';
  if (error) toast('Autosave failed: ' + error.message);
  updateSaveIndicator();
}

function updateSaveIndicator(){
  const dot = document.querySelector('.save-dot');
  const label = document.getElementById('save-label');
  if (!dot || !label) return;
  dot.className = 'save-dot' + (STATE.saveState === 'saving' ? ' saving' : (STATE.saveState === 'saved' ? ' saved' : ''));
  label.textContent = STATE.saveState === 'saving' ? 'Saving…' : (STATE.saveState === 'saved' ? 'Saved' : 'Autosaves as you go');
}

<script>
/* =========================================================================
   DATA GET/SET + PROGRESS COMPUTATION
   ========================================================================= */
function getVal(chapterId, promptId, fallback){
  const c = STATE.formData[chapterId];
  if (!c || !(promptId in c)) return fallback;
  return c[promptId];
}
function setVal(chapterId, promptId, value){
  if (!STATE.formData[chapterId]) STATE.formData[chapterId] = {};
  STATE.formData[chapterId][promptId] = value;
  queueSave();
}

// Every unit (prompt / list / contacts / checklist / goalset) that counts toward progress
function unitsForChapter(chapter){
  const units = [...(chapter.prompts || [])];
  if (chapter.specialPrompts) units.push(...chapter.specialPrompts);
  if (chapter.goals) units.push(chapter.goals);
  if (chapter.checklist) units.push(chapter.checklist);
  return units;
}

function isUnitAnswered(chapter, unit){
  const v = getVal(chapter.id, unit.id);
  if (v === undefined || v === null) return false;
  switch(unit.type){
    case 'long': case 'short':
      return String(v).trim().length > 0;
    case 'list':
      return Array.isArray(v) && v.some(x => x && x.trim().length > 0);
    case 'contacts':
      return Array.isArray(v) && v.some(r => r && ((r.name && r.name.trim()) || (r.phone && r.phone.trim())));
    case 'checklist':
      return Array.isArray(v) && v.some(x => x);
    case 'goalset':
      if (!v) return false;
      return Object.values(v).some(blockArr => Array.isArray(blockArr) && blockArr.some(b => b && ((b.goal && b.goal.trim()) || (b.steps && b.steps.trim()))));
    default: return false;
  }
}

function computeChapterProgress(chapter){
  const units = unitsForChapter(chapter);
  const total = units.length;
  const completed = units.filter(u => isUnitAnswered(chapter, u)).length;
  return { total, completed };
}

function computeOverallProgress(){
  const track = TRACKS[STATE.currentTrackKey];
  if (!track) return { total: 0, completed: 0 };
  let total = 0, completed = 0;
  track.chapters.forEach(ch => {
    const p = computeChapterProgress(ch);
    total += p.total; completed += p.completed;
  });
  return { total, completed };
}

<script>
/* =========================================================================
   WEEKLY CHECK-IN — a lightweight, ongoing tracker separate from the chapter
   content. Each entry is one week's worth of yes/no items chosen because
   they map to things that drive avoidable cost (ER/inpatient use, med
   non-adherence, housing instability) so the program has real data behind
   the "peer support reduces utilization" story. Visit Prep reads this same
   data to auto-fill its Care Snapshot.
   ========================================================================= */
const CHECKIN_ITEMS = [
  { id:'appt_kept',      label:'Went to a scheduled appointment this week (PCP, psychiatry, therapy, etc.)' },
  { id:'meds_taken',     label:'Took medication as prescribed' },
  { id:'coping_used',    label:'Used a coping skill instead of going to the ER or calling 911' },
  { id:'warmline_used',  label:'Called the Warmline or a crisis line instead of a higher level of care' },
  { id:'housing_stable', label:'Stayed in stable housing this week' },
  { id:'connected',      label:'Connected with someone in my support network' }
];

function ensureCheckinShape(){
  if (!STATE.formData.entries) STATE.formData.entries = [];
}

function newCheckinId(){ return 'wk_' + Date.now() + '_' + Math.floor(Math.random()*1000); }

function todayISO(){ return new Date().toISOString().slice(0,10); }

function addCheckinEntry(){
  ensureCheckinShape();
  STATE.formData.entries.unshift({ id:newCheckinId(), date:todayISO(), checks:{}, note:'' });
  queueSave();
  renderCheckinPage();
}

function removeCheckinEntry(eid){
  ensureCheckinShape();
  STATE.formData.entries = STATE.formData.entries.filter(e => e.id !== eid);
  queueSave();
  renderCheckinPage();
}

function setCheckinField(eid, field, value){
  ensureCheckinShape();
  const entry = STATE.formData.entries.find(e => e.id === eid);
  if (!entry) return;
  entry[field] = value;
  queueSave();
}

function setCheckinCheck(eid, itemId, checked){
  ensureCheckinShape();
  const entry = STATE.formData.entries.find(e => e.id === eid);
  if (!entry) return;
  if (!entry.checks) entry.checks = {};
  entry.checks[itemId] = checked;
  queueSave();
}

// Shared by the Check-In page's own summary and the Visit Prep auto-pull.
function summarizeCheckinEntries(entries, days){
  entries = entries || [];
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - days);
  const inWindow = entries.filter(e => e.date && new Date(e.date) >= cutoff);
  const n = inWindow.length;
  const pctFor = key => n ? Math.round(100 * inWindow.filter(e => e.checks && e.checks[key]).length / n) : null;
  const out = { n, days };
  CHECKIN_ITEMS.forEach(item => { out[item.id] = pctFor(item.id); });
  return out;
}

function checkinStatLineHTML(summary){
  if (!summary.n){
    return `<p style="font-size:13.5px; color:var(--ink-soft); margin:0;">No check-ins logged in the last ${summary.days} days yet.</p>`;
  }
  return `
    <p style="font-size:12px; color:var(--ink-soft); margin:0 0 10px;">Based on ${summary.n} check-in${summary.n === 1 ? '' : 's'} in the last ${summary.days} days.</p>
    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:10px;">
      ${CHECKIN_ITEMS.map(item => `
        <div style="background:var(--paper); border-radius:10px; padding:10px 12px;">
          <div style="font-size:20px; font-weight:800; color:var(--ink);">${summary[item.id] === null ? '—' : summary[item.id] + '%'}</div>
          <div style="font-size:11.5px; color:var(--ink-soft); margin-top:2px; line-height:1.35;">${esc(item.label)}</div>
        </div>`).join('')}
    </div>`;
}

function renderCheckinEntries(){
  ensureCheckinShape();
  if (!STATE.formData.entries.length){
    return `<p style="color:var(--ink-soft); font-size:13.5px; margin:0;">No check-ins yet — tap "+ Add this week's check-in" to start.</p>`;
  }
  return STATE.formData.entries.map(e => `
    <div class="res-card" style="margin-bottom:14px;">
      <div style="display:flex; align-items:center; gap:12px; margin-bottom:6px; flex-wrap:wrap;">
        <input class="answer" type="date" style="max-width:170px;" data-role="checkin-field" data-eid="${e.id}" data-field="date" value="${esc(e.date || '')}">
        <div style="flex:1;"></div>
        <button class="remove-person" onclick="removeCheckinEntry('${e.id}')" type="button">Remove</button>
      </div>
      ${CHECKIN_ITEMS.map(item => `
        <div class="checklist-item">
          <input type="checkbox" id="ci-${e.id}-${item.id}" data-role="checkin-check" data-eid="${e.id}" data-item="${item.id}" ${e.checks && e.checks[item.id] ? 'checked' : ''}>
          <label for="ci-${e.id}-${item.id}">${esc(item.label)}</label>
        </div>`).join('')}
      <textarea class="answer" style="margin-top:10px;" placeholder="Anything else worth noting this week?" data-role="checkin-field" data-eid="${e.id}" data-field="note">${esc(e.note || '')}</textarea>
    </div>`).join('');
}

function renderCheckinPage(){
  ensureCheckinShape();
  const client = STATE.currentClient;
  const summary4wk = summarizeCheckinEntries(STATE.formData.entries, 28);
  app.innerHTML = `
    ${topbarHTML({ showSave: true, crumb: `${client.full_name} · Weekly Check-In` })}
    <div class="wrap">
      <button class="btn btn-ghost btn-sm" onclick="backToTrackPicker()">← ${STATE.viewerRole === 'client' ? 'Back' : esc(client.full_name) + "'s workbooks"}</button>
      <div class="page-head" style="margin-top:14px;">
        <div>
          <div class="eyebrow">${esc(client.full_name)}</div>
          <h1>Weekly Check-In</h1>
        </div>
      </div>
      <p style="color:var(--ink-soft); font-size:14.5px; margin:-8px 0 18px;">A quick check-in, once a week, on the things that matter most for staying well and staying out of the hospital or ER. Takes a minute. Builds a real record over time.</p>

      <div class="res-card" style="border-color:var(--ink);">
        <div class="res-card-cat">Last 4 weeks</div>
        ${checkinStatLineHTML(summary4wk)}
      </div>

      <button class="add-person-btn" style="margin-bottom:16px;" onclick="addCheckinEntry()" type="button">+ Add this week's check-in</button>

      ${renderCheckinEntries()}
    </div>
    ${siteFooterHTML()}`;
}
</script>
<script>
/* =========================================================================
   VISIT PREP — helps a client walk into a PCP or psychiatry appointment
   ready: questions to ask, a snapshot of how the last couple weeks have
   gone (pulled from Weekly Check-In), and a place to capture what actually
   happened so the loop closes and the next check-in / visit builds on it.
   ========================================================================= */
const VISIT_TYPES = [
  { key:'pcp',        label:'Primary Care',        icon:'🩺' },
  { key:'psychiatry', label:'Psychiatry',          icon:'🧠' },
  { key:'therapist',  label:'Therapist / Counselor', icon:'💬' },
  { key:'other',      label:'Other appointment',   icon:'📋' }
];

const VISIT_QUESTION_BANKS = {
  pcp: [
    'Can we check my blood pressure and weight today?',
    'I\'ve been having a symptom that\'s worrying me — could that be related to my medication?',
    'Can we do bloodwork to check on my overall health?',
    'Is it safe to take my mental health medication with what you\'re prescribing?',
    'Can you refer me to a specialist for this?',
    'Can we talk about my sleep? I\'ve been having trouble.',
    'Is there anything I should be doing differently with my diet or exercise?',
    'Can I get a copy of my visit summary today?'
  ],
  psychiatry: [
    'Since my last visit, I\'ve noticed a change — is that normal?',
    'I\'ve been having side effects — should we adjust anything?',
    'Is my current dose still the right one for me?',
    'How long should it take before I notice this medication working?',
    'What should I do if I miss a dose?',
    'Can we talk about how my sleep has been?',
    'Does it change anything that I\'ve missed some doses recently?',
    'What are the warning signs I should watch for before my next visit?'
  ],
  therapist: [
    'Can we spend time today on something specific that\'s been hard?',
    'What can I practice between now and our next session?',
    'I tried the skill we talked about last time — can we talk about how it went?',
    'Is what I\'m feeling normal for where I\'m at in recovery?'
  ],
  other: []
};

function ensureVisitPrepShape(){
  if (!STATE.formData.visits) STATE.formData.visits = [];
}

function newVisitId(){ return 'v_' + Date.now() + '_' + Math.floor(Math.random()*1000); }

function visitTypeInfo(key){ return VISIT_TYPES.find(t => t.key === key) || VISIT_TYPES[3]; }

function addVisit(typeKey){
  ensureVisitPrepShape();
  const v = { id:newVisitId(), type:typeKey, date:'', status:'upcoming', questions:[], prep_notes:'',
    summary_what_said:'', summary_changes:'', summary_followup_date:'', summary_notes:'' };
  STATE.formData.visits.unshift(v);
  queueSave();
  STATE.currentVisitId = v.id;
  render();
}

function removeVisit(vid){
  ensureVisitPrepShape();
  STATE.formData.visits = STATE.formData.visits.filter(v => v.id !== vid);
  queueSave();
  STATE.currentVisitId = null;
  render();
}

function openVisit(vid){ STATE.currentVisitId = vid; render(); }
function backToVisitList(){ STATE.currentVisitId = null; render(); }

function getCurrentVisit(){
  ensureVisitPrepShape();
  return STATE.formData.visits.find(v => v.id === STATE.currentVisitId);
}

function setVisitField(vid, field, value){
  const v = STATE.formData.visits.find(v => v.id === vid);
  if (!v) return;
  v[field] = value;
  queueSave();
}

function setVisitStatus(vid, status){
  setVisitField(vid, 'status', status);
  render();
}

function addVisitQuestion(vid, text){
  const v = STATE.formData.visits.find(v => v.id === vid);
  if (!v || !text || !text.trim()) return;
  if (!v.questions) v.questions = [];
  v.questions.push({ id:'q_' + Date.now() + '_' + Math.floor(Math.random()*1000), text:text.trim(), asked:false });
  queueSave();
  refreshVisitQuestionsUI();
}

function addVisitQuestionFromBank(vid, idx){
  const v = STATE.formData.visits.find(v => v.id === vid);
  const bank = VISIT_QUESTION_BANKS[v.type] || [];
  addVisitQuestion(vid, bank[idx]);
}

function addCustomVisitQuestion(vid){
  const input = document.getElementById('custom-q-input');
  if (!input) return;
  addVisitQuestion(vid, input.value);
  input.value = '';
}

function removeVisitQuestion(vid, qid){
  const v = STATE.formData.visits.find(v => v.id === vid);
  if (!v) return;
  v.questions = (v.questions || []).filter(q => q.id !== qid);
  queueSave();
  refreshVisitQuestionsUI();
}

function setVisitQuestionText(vid, qid, text){
  const v = STATE.formData.visits.find(v => v.id === vid);
  const q = v && (v.questions || []).find(q => q.id === qid);
  if (q) q.text = text;
  queueSave();
}

function toggleVisitQuestionAsked(vid, qid, checked){
  const v = STATE.formData.visits.find(v => v.id === vid);
  const q = v && (v.questions || []).find(q => q.id === qid);
  if (q) q.asked = checked;
  queueSave();
}

function refreshVisitQuestionsUI(){
  const host = document.getElementById('visit-q-section');
  const v = getCurrentVisit();
  if (host && v) host.innerHTML = renderVisitQuestionsSection(v);
}

function renderVisitQuestionsSection(v){
  const bank = VISIT_QUESTION_BANKS[v.type] || [];
  const already = (v.questions || []).map(q => q.text);
  const bankButtons = bank.filter(q => !already.includes(q)).map((q, i) => {
    // i must map back to the original bank index for addVisitQuestionFromBank
    const origIdx = bank.indexOf(q);
    return `<button class="btn btn-ghost btn-sm" style="text-align:left; height:auto; white-space:normal;" onclick="addVisitQuestionFromBank('${v.id}', ${origIdx})">+ ${esc(q)}</button>`;
  }).join('');

  const questionRows = (v.questions || []).map(q => `
    <div class="res-item">
      <input type="checkbox" title="Asked at the visit" data-role="visit-q-check" data-vid="${v.id}" data-qid="${q.id}" ${q.asked ? 'checked' : ''}>
      <div class="res-item-main">
        <textarea class="answer" style="min-height:44px;" data-role="visit-q-text" data-vid="${v.id}" data-qid="${q.id}">${esc(q.text)}</textarea>
      </div>
      <button class="remove-person" onclick="removeVisitQuestion('${v.id}','${q.id}')" type="button">Remove</button>
    </div>`).join('');

  return `
    ${bankButtons ? `
      <div style="margin-bottom:12px;">
        <div style="font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:8px;">Tap to add a starter question</div>
        <div style="display:flex; flex-direction:column; gap:6px;">${bankButtons}</div>

    <div style="display:flex; gap:8px; margin-bottom:12px;">
      <input class="answer" id="custom-q-input" type="text" placeholder="Write your own question…">
      <button class="btn btn-primary btn-sm" onclick="addCustomVisitQuestion('${v.id}')" type="button">+ Add</button>

}

function visitCareSnapshotHTML(){
  const entries = STATE.checkinCache || [];

  return `
    <div class="res-card" style="border-color:var(--ink);">
      <div class="res-card-cat">Care snapshot — last 2 weeks</div>
      ${checkinStatLineHTML(summary)}
      ${!summary.n ? `<p style="font-size:12px; color:var(--ink-soft); margin:10px 0 0;">This fills in automatically once weekly check-ins are logged.</p>` : ''}

}

function visitListItemHTML(v){

  return `
    <div class="res-item" style="cursor:pointer;" onclick="openVisit('${v.id}')">

        </div>
        <div class="rdesc">${(v.questions || []).length} question${(v.questions || []).length === 1 ? '' : 's'}${(v.questions || []).length ? ` · ${askedCount} asked` : ''}</div>
      </div>
    </div>`;
}

function renderVisitPrepList(){
  const client = STATE.currentClient;
  ensureVisitPrepShape();

  app.innerHTML = `
    ${topbarHTML({ showSave: true, crumb: `${client.full_name} · Visit Prep` })}
    <div class="wrap">
      <button class="btn btn-ghost btn-sm" onclick="backToTrackPicker()">← ${STATE.viewerRole === 'client' ? 'Back' : esc(client.full_name) + "'s workbooks"}</button>
      <div class="page-head" style="margin-top:14px;">

function renderVisitPrepPage(){
  ensureVisitPrepShape();

<script>
/* =========================================================================
   COPING SKILLS TOOLBOX — a running, ratable list of what actually helps.
   A pinned Box Breathing exercise is always present. Every use (helped or
   not) is logged, which doubles as the same kind of utilization evidence
   as Weekly Check-In: "skill used and rated helpful N times."
   ========================================================================= */
const BREATHING_SKILL_ID = 'breathing';
const BREATHE_PHASES = ['Breathe in…', 'Hold…', 'Breathe out…', 'Hold…'];
let breatheTimer = null;

function ensureToolboxShape(){
  if (!STATE.formData.skills) STATE.formData.skills = [];
  if (!STATE.formData.skills.find(s => s.id === BREATHING_SKILL_ID)){
    STATE.formData.skills.unshift({
      id: BREATHING_SKILL_ID,
      name: 'Box Breathing',
      notes: 'Breathe in for 4 counts, hold for 4, breathe out for 4, hold for 4. Repeat 4-6 times.',
      pinned: true,
      log: []
    });
  }
}

function newSkillId(){ return 'sk_' + Date.now() + '_' + Math.floor(Math.random()*1000); }

function addSkill(){
  ensureToolboxShape();
  STATE.formData.skills.push({ id:newSkillId(), name:'', notes:'', log:[] });
  queueSave();
  renderToolboxPage();
}

function removeSkill(sid){
  ensureToolboxShape();
  STATE.formData.skills = STATE.formData.skills.filter(s => !(s.id === sid && !s.pinned));
  queueSave();
  renderToolboxPage();
}

function setSkillField(sid, field, value){
  ensureToolboxShape();
  const s = STATE.formData.skills.find(s => s.id === sid);
  if (s) s[field] = value;
  queueSave();
}

function logSkillUse(sid, helped){
  ensureToolboxShape();
  const s = STATE.formData.skills.find(s => s.id === sid);
  if (!s) return;
  if (!s.log) s.log = [];
  s.log.push({ date: todayISO(), helped: !!helped });
  queueSave();
  renderToolboxPage();
}

function skillStatsHTML(s){
  const log = s.log || [];
  const n = log.length;
  if (!n) return `<p style="font-size:12px; color:var(--ink-soft); margin:8px 0 0;">Not logged yet.</p>`;
  const helpedN = log.filter(l => l.helped).length;
  return `<p style="font-size:12px; color:var(--ink-soft); margin:8px 0 0;">Used ${n} time${n === 1 ? '' : 's'} · helped ${helpedN} of ${n} time${n === 1 ? '' : 's'}.</p>`;
}

function breathingWidgetHTML(){
  return `
    <div style="text-align:center; margin:14px 0;">
      <div class="breathe-circle"></div>
      <div class="breathe-label" id="breathe-label-text">Breathe in…</div>
    </div>`;
}

function startBreathing(){
  if (breatheTimer) return;
  const label = document.getElementById('breathe-label-text');
  if (!label) return; // toolbox page isn't showing right now
  let i = 0;
  label.textContent = BREATHE_PHASES[0];
  breatheTimer = setInterval(() => {
    i = (i + 1) % BREATHE_PHASES.length;
    const el = document.getElementById('breathe-label-text');
    if (el) el.textContent = BREATHE_PHASES[i];
  }, 4000);
}

function stopBreathing(){
  if (breatheTimer){ clearInterval(breatheTimer); breatheTimer = null; }
}

function renderSkillCard(s){
  const isBreathing = s.id === BREATHING_SKILL_ID;
  return `
    <div class="res-card" style="${isBreathing ? 'border-color:var(--ink);' : ''}">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
        <div style="flex:1;">
          ${isBreathing
            ? `<div class="res-card-cat">Always here</div>
               <div style="font-weight:700; font-size:15px;">🌬️ ${esc(s.name)}</div>
               <p style="font-size:13px; color:var(--ink-soft); margin:4px 0 0;">${esc(s.notes)}</p>`
            : `<input class="answer" type="text" placeholder="Name this skill (e.g. Call my sponsor, Go for a walk)" data-role="skill-field" data-sid="${s.id}" data-field="name" value="${esc(s.name)}" style="font-weight:700; margin-bottom:8px;">
               <textarea class="answer" placeholder="What does doing this look like for you?" data-role="skill-field" data-sid="${s.id}" data-field="notes">${esc(s.notes)}</textarea>`}
        </div>
        ${!isBreathing ? `<button class="remove-person" onclick="removeSkill('${s.id}')" type="button">Remove</button>` : ''}
      </div>
      ${isBreathing ? breathingWidgetHTML() : ''}
      <div style="display:flex; align-items:center; gap:10px; margin-top:10px; flex-wrap:wrap;">
        <span style="font-size:13px; font-weight:600;">Used this — did it help?</span>
        <button class="btn btn-ghost btn-sm" onclick="logSkillUse('${s.id}', true)" type="button">👍 Helped</button>
        <button class="btn btn-ghost btn-sm" onclick="logSkillUse('${s.id}', false)" type="button">👎 Not this time</button>
      </div>
      ${skillStatsHTML(s)}
    </div>`;
}

function renderToolboxPage(){
  ensureToolboxShape();
  const client = STATE.currentClient;
  app.innerHTML = `
    ${topbarHTML({ showSave: true, crumb: `${client.full_name} · Coping Skills Toolbox` })}
    <div class="wrap">
      <button class="btn btn-ghost btn-sm" onclick="backToTrackPicker()">← ${STATE.viewerRole === 'client' ? 'Back' : esc(client.full_name) + "'s workbooks"}</button>
      <div class="page-head" style="margin-top:14px;">
        <div>
          <div class="eyebrow">${esc(client.full_name)}</div>
          <h1>Coping Skills Toolbox</h1>
        </div>
      </div>
      <p style="color:var(--ink-soft); font-size:14.5px; margin:-8px 0 18px;">A running list of things that actually help — build it together, and check in on what's working.</p>
      ${STATE.formData.skills.map(renderSkillCard).join('')}
      <button class="add-person-btn" onclick="addSkill()" type="button">+ Add a coping skill</button>
    </div>
    ${siteFooterHTML()}`;
  startBreathing();
}
</script>
<script>
/* =========================================================================
   ANXIETY & EXPOSURE LADDER — build a list of anxiety-provoking situations,
   easiest to hardest, and log each attempt's before/during/after anxiety
   (0-10). Watching the "during" number drop across attempts is the whole
   point — real, earned evidence of progress, no badge required.
   ========================================================================= */
function ensureExposureShape(){
  if (!STATE.formData.rungs) STATE.formData.rungs = [];
  if (!STATE.formData.attempts) STATE.formData.attempts = [];
}

function newRungId(){ return 'r_' + Date.now() + '_' + Math.floor(Math.random()*1000); }
function newAttemptId(){ return 'a_' + Date.now() + '_' + Math.floor(Math.random()*1000); }

function addRung(){
  ensureExposureShape();
  STATE.formData.rungs.push({ id:newRungId(), situation:'', startAnxiety:5 });
  queueSave();
  renderExposurePage();
}

function removeRung(rid){
  ensureExposureShape();
  STATE.formData.rungs = STATE.formData.rungs.filter(r => r.id !== rid);
  STATE.formData.attempts = STATE.formData.attempts.filter(a => a.rungId !== rid);
  queueSave();
  renderExposurePage();
}

function setRungField(rid, field, value){
  ensureExposureShape();
  const r = STATE.formData.rungs.find(r => r.id === rid);
  if (!r) return;
  r[field] = (field === 'startAnxiety') ? clampAnxiety(value) : value;
  queueSave();
}

function moveRung(rid, dir){
  ensureExposureShape();
  const arr = STATE.formData.rungs;
  const idx = arr.findIndex(r => r.id === rid);
  const swapIdx = idx + dir;
  if (idx < 0 || swapIdx < 0 || swapIdx >= arr.length) return;
  const tmp = arr[idx]; arr[idx] = arr[swapIdx]; arr[swapIdx] = tmp;
  queueSave();
  renderExposurePage();
}

function clampAnxiety(value){
  const n = Math.round(Number(value));
  if (isNaN(n)) return 0;
  return Math.max(0, Math.min(10, n));
}

function addAttempt(rungId){
  ensureExposureShape();
  STATE.formData.attempts.unshift({ id:newAttemptId(), rungId, date:todayISO(), before:5, during:5, after:5, notes:'' });
  queueSave();
  renderExposurePage();
}

function removeAttempt(aid){
  ensureExposureShape();
  STATE.formData.attempts = STATE.formData.attempts.filter(a => a.id !== aid);
  queueSave();
  renderExposurePage();
}

function setAttemptField(aid, field, value){
  ensureExposureShape();
  const a = STATE.formData.attempts.find(a => a.id === aid);
  if (!a) return;
  a[field] = ['before','during','after'].includes(field) ? clampAnxiety(value) : value;
  queueSave();
}

function rungTrendHTML(rung){
  const atts = (STATE.formData.attempts || [])
    .filter(a => a.rungId === rung.id)
    .slice()
    .sort((a, b) => new Date(a.date) - new Date(b.date));
  if (!atts.length){
    return `<p style="font-size:12px; color:var(--ink-soft); margin:8px 0 0;">No attempts logged yet.</p>`;
  }
  const first = atts[0], last = atts[atts.length - 1];
  return `<p style="font-size:12px; color:var(--ink-soft); margin:8px 0 0;">First try: ${first.during}/10 anxiety during · Most recent: ${last.during}/10 · ${atts.length} attempt${atts.length === 1 ? '' : 's'} logged.</p>`;
}

function attemptRowHTML(a){
  return `
    <div style="border-top:1px solid var(--line); padding-top:10px; margin-top:10px;">
      <div class="care-row" style="grid-template-columns:1fr 1fr 1fr 1fr;">
        <input class="answer" type="date" data-role="attempt-field" data-aid="${a.id}" data-field="date" value="${esc(a.date)}">
        <div><label style="font-size:11px; color:var(--ink-soft); display:block;">Before</label><input type="number" min="0" max="10" class="answer" data-role="attempt-field" data-aid="${a.id}" data-field="before" value="${a.before}"></div>
        <div><label style="font-size:11px; color:var(--ink-soft); display:block;">Highest during</label><input type="number" min="0" max="10" class="answer" data-role="attempt-field" data-aid="${a.id}" data-field="during" value="${a.during}"></div>
        <div><label style="font-size:11px; color:var(--ink-soft); display:block;">After</label><input type="number" min="0" max="10" class="answer" data-role="attempt-field" data-aid="${a.id}" data-field="after" value="${a.after}"></div>
      </div>
      <textarea class="answer" style="margin-top:8px;" placeholder="What did you notice?" data-role="attempt-field" data-aid="${a.id}" data-field="notes">${esc(a.notes || '')}</textarea>
      <div style="text-align:right; margin-top:4px;"><button class="remove-person" onclick="removeAttempt('${a.id}')" type="button">Remove this try</button></div>
    </div>`;
}

function renderRungCard(rung, idx, total){
  const attempts = (STATE.formData.attempts || [])
    .filter(a => a.rungId === rung.id)
    .slice()
    .sort((a, b) => new Date(b.date) - new Date(a.date));
  return `
    <div class="res-card">
      <div style="display:flex; gap:10px; align-items:flex-start;">

<script>
/* =========================================================================
   THEN & NOW — a read-only comparison of the client's own answers, early
   chapter vs. late chapter, within whichever track is currently open. No
   new storage: this just reads two prompts already saved in formData.
   ========================================================================= */
const THEN_NOW_PAIRS_BASE = [
  { earlyCh:'ch1', earlyPrompt:'why_change', lateCh:'ch3', latePrompt:'life_different', label:"Why you wanted this to change → How life is different now" },
  { earlyCh:'ch1', earlyPrompt:'barriers', lateCh:'ch3', latePrompt:'keep_barriers', label:"What got in the way then → What could get in the way now" },
  { earlyCh:'ch2', earlyPrompt:'kid_goals', lateCh:'ch3', latePrompt:'ltr_looks_like', label:"Old dreams and goals → What long-term recovery looks like now" }
];
// mh's chapter 1 uses a differently-named prompt id for the same question.
const THEN_NOW_OVERRIDES = { mh: { why_change: 'why_now' } };

function thenNowPairsForTrack(trackKey){
  const overrides = THEN_NOW_OVERRIDES[trackKey] || {};
  return THEN_NOW_PAIRS_BASE.map(p => ({
    ...p,
    earlyPrompt: overrides[p.earlyPrompt] || p.earlyPrompt
  }));
}

function renderThenNowPage(){
  const track = TRACKS[STATE.currentTrackKey];
  const client = STATE.currentClient;
  const pairs = thenNowPairsForTrack(track.key);
  const rows = pairs.map(p => {
    const early = getVal(p.earlyCh, p.earlyPrompt, '');
    const late = getVal(p.lateCh, p.latePrompt, '');
    const earlyFilled = String(early || '').trim().length > 0;
    const lateFilled = String(late || '').trim().length > 0;
    if (!earlyFilled && !lateFilled) return '';
    const earlyChNum = track.chapters.find(c => c.id === p.earlyCh).num;
    const lateChNum = track.chapters.find(c => c.id === p.lateCh).num;
    return `
      <div class="res-card">
        <div class="res-card-cat">${esc(p.label)}</div>
        <div class="thennow-grid">
          <div>
            <div style="font-size:11px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; margin-bottom:4px;">Then — Chapter ${earlyChNum}</div>
            <div style="font-size:14px; white-space:pre-wrap;">${earlyFilled ? esc(early) : '<span style="color:var(--ink-soft);">Not answered yet.</span>'}</div>
          </div>
          <div>
            <div style="font-size:11px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; margin-bottom:4px;">Now — Chapter ${lateChNum}</div>
            <div style="font-size:14px; white-space:pre-wrap;">${lateFilled ? esc(late) : '<span style="color:var(--ink-soft);">Not answered yet.</span>'}</div>
          </div>
        </div>
      </div>`;
  }).filter(Boolean).join('');

  app.innerHTML = `
    ${topbarHTML({ showSave: false, crumb: `${client.full_name} · ${track.label} · Then & Now` })}
    <div class="wrap">
      <button class="btn btn-ghost btn-sm" onclick="closeWbTool()">← Back to workbook</button>
