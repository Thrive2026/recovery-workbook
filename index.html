          <div class="eyebrow">${esc(client.full_name)}</div>
          <h1>Then &amp; Now</h1>
        </div>
      </div>
      <p style="color:var(--ink-soft); font-size:14.5px; margin:-8px 0 18px;">Your own words, side by side — from earlier in this workbook and more recently. Fill in more chapters and this page fills in too.</p>
      ${rows || '<p style="color:var(--ink-soft); font-size:13.5px;">Nothing to compare yet — answer a few more questions in Chapter 1 and Chapter 3 and this will fill in.</p>'}
    </div>
    ${siteFooterHTML()}`;
}
</script>
<script>
/* =========================================================================
   LETTER TO MY FUTURE SELF — written early, opened whenever feels right.
   Lives inside the same track's formData (no new storage) under a fixed
   key rather than a chapter id, so it survives independent of chapter
   content changes.
   ========================================================================= */
function ensureLetterShape(){
  if (STATE.formData.futureLetter === undefined) STATE.formData.futureLetter = null;
}

function saveLetterDraft(text){
  ensureLetterShape();
  if (!STATE.formData.futureLetter) STATE.formData.futureLetter = { text:'', dateWritten:'', revealed:false };
  STATE.formData.futureLetter.text = text;
  queueSave();
}

function sealLetter(){
  const ta = document.getElementById('letter-draft');
  if (!ta || !ta.value.trim()){ toast('Write something first.'); return; }
  STATE.formData.futureLetter = { text: ta.value, dateWritten: todayISO(), revealed:false };
  queueSave();
  renderLetterPage();
}

function revealLetter(){
  ensureLetterShape();
  if (STATE.formData.futureLetter) STATE.formData.futureLetter.revealed = true;
  queueSave();
  renderLetterPage();
}

function rewriteLetter(){
  STATE.formData.futureLetter = null;
  queueSave();
  renderLetterPage();
}

function renderLetterPage(){
  ensureLetterShape();
  const client = STATE.currentClient;
  const letter = STATE.formData.futureLetter;
  let bodyHTML;

  if (!letter || !letter.dateWritten){
    const draftText = letter ? letter.text : '';
    bodyHTML = `
      <div class="res-card" style="border-color:var(--ink);">
        <div class="res-card-cat">Write a letter to your future self</div>
        <p style="font-size:13.5px; color:var(--ink-soft); margin:0 0 12px;">What do you want to remember? What do you hope for? What do you want future you to know? Seal it, and come back to it whenever you're ready.</p>
        <textarea class="answer" id="letter-draft" data-role="letter-draft" style="min-height:160px;" placeholder="Dear me,">${esc(draftText)}</textarea>
        <button class="btn btn-primary btn-sm" style="margin-top:10px;" onclick="sealLetter()" type="button">✉️ Seal this letter</button>
      </div>`;
  } else if (!letter.revealed){
    bodyHTML = `
      <div class="res-card" style="border-color:var(--ink); text-align:center; padding:30px 18px;">
        <div style="font-size:38px; margin-bottom:10px;">✉️</div>
        <p style="font-size:14.5px; margin:0 0 4px;">You wrote yourself a letter on ${esc(letter.dateWritten)}.</p>
        <p style="font-size:13px; color:var(--ink-soft); margin:0 0 16px;">Open it whenever feels right — no rush.</p>
        <button class="btn btn-primary btn-sm" onclick="revealLetter()" type="button">Open the letter</button>
      </div>`;
  } else {
    bodyHTML = `
      <div class="res-card" style="border-color:var(--ink);">
        <div class="res-card-cat">Written ${esc(letter.dateWritten)}</div>
        <div style="font-size:14.5px; white-space:pre-wrap; line-height:1.6;">${esc(letter.text)}</div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="rewriteLetter()" type="button">Write a new letter</button>`;
  }

  app.innerHTML = `
    ${topbarHTML({ showSave: true, crumb: `${client.full_name} · Letter to My Future Self` })}
    <div class="wrap">
      <button class="btn btn-ghost btn-sm" onclick="closeWbTool()">← Back to workbook</button>
      <div class="page-head" style="margin-top:14px;">
        <div>
          <div class="eyebrow">${esc(client.full_name)}</div>
          <h1>Letter to My Future Self</h1>
        </div>
      </div>
      ${bodyHTML}
    </div>
    ${siteFooterHTML()}`;
}
</script>
<script>
/* =========================================================================
   PROMPT RENDERERS — one HTML builder per prompt type
   ========================================================================= */
function speakBtnHTML(text){
  return `<button type="button" class="speak-btn" title="Read this out loud" onclick="speak(${JSON.stringify(text).replace(/"/g,'&quot;')})">🔊</button>`;
}

function renderUnit(chapter, unit){
  switch(unit.type){
    case 'long': return renderLong(chapter, unit);
    case 'short': return renderShort(chapter, unit);
    case 'list': return renderList(chapter, unit);
    case 'contacts': return renderContacts(chapter, unit);
    case 'checklist': return renderChecklist(chapter, unit);
    case 'goalset': return renderGoalset(chapter, unit);
    default: return '';
  }
}

function renderLong(chapter, unit){
  const val = getVal(chapter.id, unit.id, '');
  return `
  <div class="prompt-block">
    <div class="p-label">${esc(unit.label)} ${speakBtnHTML(unit.label)}</div>
    ${unit.hint ? `<div class="p-hint">${esc(unit.hint)}</div>` : ''}
    <textarea class="answer" data-role="prompt" data-chapter="${chapter.id}" data-prompt="${unit.id}" data-type="long"
      placeholder="Write as much or as little as feels right…">${esc(val)}</textarea>
  </div>`;
}

function renderShort(chapter, unit){
  const val = getVal(chapter.id, unit.id, '');
  return `
  <div class="prompt-block">
    <div class="p-label">${esc(unit.label)}</div>
    ${unit.hint ? `<div class="p-hint">${esc(unit.hint)}</div>` : ''}
    <input class="answer" type="text" data-role="prompt" data-chapter="${chapter.id}" data-prompt="${unit.id}" data-type="short" value="${esc(val)}">
  </div>`;
}

function renderList(chapter, unit){
  const arr = getVal(chapter.id, unit.id, new Array(unit.n).fill(''));
  const rows = [];
  for (let i = 0; i < unit.n; i++){
    rows.push(`
      <div class="list-row">
        <div class="idx">${i+1}</div>
        <input class="answer" type="text" data-role="list-item" data-chapter="${chapter.id}" data-prompt="${unit.id}" data-idx="${i}" data-n="${unit.n}"
          placeholder="${esc(unit.placeholder || '')}" value="${esc(arr[i] || '')}">
      </div>`);
  }
  return `
  <div class="prompt-block">
    <div class="p-label">${esc(unit.label)}</div>
    ${unit.hint ? `<div class="p-hint">${esc(unit.hint)}</div>` : ''}
    <div class="list-rows">${rows.join('')}</div>
  </div>`;
}

function renderContacts(chapter, unit){
  const arr = getVal(chapter.id, unit.id, new Array(unit.n).fill(null).map(()=>({name:'',phone:''})));
  const rows = [];
  for (let i = 0; i < unit.n; i++){
    const r = arr[i] || {name:'',phone:''};
    rows.push(`
      <div class="contact-row">
        <input class="answer" type="text" data-role="contact-field" data-chapter="${chapter.id}" data-prompt="${unit.id}" data-idx="${i}" data-n="${unit.n}" data-field="name" placeholder="Name" value="${esc(r.name)}">
        <input class="answer" type="text" data-role="contact-field" data-chapter="${chapter.id}" data-prompt="${unit.id}" data-idx="${i}" data-n="${unit.n}" data-field="phone" placeholder="Phone number" value="${esc(r.phone)}">
      </div>`);
  }
  return `
  <div class="prompt-block">
    <div class="p-label">${esc(unit.label)}</div>
    ${unit.hint ? `<div class="p-hint">${esc(unit.hint)}</div>` : ''}
    ${rows.join('')}
  </div>`;
}

function renderChecklist(chapter, unit){
  const arr = getVal(chapter.id, unit.id, new Array(unit.items.length).fill(false));
  const rows = unit.items.map((item, i) => `
    <div class="checklist-item">
      <input type="checkbox" id="chk-${chapter.id}-${unit.id}-${i}" data-role="checklist-item" data-chapter="${chapter.id}" data-prompt="${unit.id}" data-idx="${i}" data-n="${unit.items.length}" ${arr[i] ? 'checked' : ''}>
      <label for="chk-${chapter.id}-${unit.id}-${i}">${esc(item)}</label>
    </div>`).join('');
  return `
  <div class="prompt-block">
    <div class="p-label">${esc(unit.label)}</div>
    ${unit.hint ? `<div class="p-hint">${esc(unit.hint)}</div>` : ''}
    ${rows}
  </div>`;
}

function renderGoalset(chapter, unit){
  const data = getVal(chapter.id, unit.id, {});
  const blocksHTML = unit.blocks.map(block => {
    const arr = data[block.key] || new Array(block.count).fill(null).map(()=>({goal:'',steps:'',barriers:''}));
    const goalBlocks = [];
    for (let i = 0; i < block.count; i++){
      const g = arr[i] || {goal:'',steps:'',barriers:''};
      goalBlocks.push(`
        <div class="goal-block">
          <div class="gfield">
            <label>Goal</label>
            <textarea class="answer" data-role="goal-field" data-chapter="${chapter.id}" data-prompt="${unit.id}" data-blockkey="${block.key}" data-blockcount="${block.count}" data-idx="${i}" data-field="goal">${esc(g.goal)}</textarea>
          </div>
          <div class="gfield">
            <label>Steps to get there</label>
            <textarea class="answer" data-role="goal-field" data-chapter="${chapter.id}" data-prompt="${unit.id}" data-blockkey="${block.key}" data-blockcount="${block.count}" data-idx="${i}" data-field="steps">${esc(g.steps)}</textarea>
          </div>
          <div class="gfield">
            <label>What might get in the way</label>
            <textarea class="answer" data-role="goal-field" data-chapter="${chapter.id}" data-prompt="${unit.id}" data-blockkey="${block.key}" data-blockcount="${block.count}" data-idx="${i}" data-field="barriers">${esc(g.barriers)}</textarea>
          </div>
        </div>`);
    }
    return `<div class="goal-timeframe"><h4>${esc(block.title)}</h4>${goalBlocks.join('')}</div>`;
  }).join('');
  return `
  <div class="prompt-block">
    <div class="p-label">${esc(unit.label)}</div>
    ${unit.hint ? `<div class="p-hint">${esc(unit.hint)}</div>` : ''}
    ${blocksHTML}
  </div>`;
}
</script>
<script>
/* =========================================================================
   INTRO CONTENT RENDERER (paragraphs, quotes, principle lists)
   ========================================================================= */
function renderIntro(intro){
  const parts = intro.map(block => {
    if (block.type === 'p') return `<p>${esc(block.text)}</p>`;
    if (block.type === 'quote') return `<div class="quote-block">"${esc(block.text)}"${block.by ? `<span class="by">— ${esc(block.by)}</span>` : ''}</div>`;
    if (block.type === 'principles'){
      return `<ul class="principles">${block.items.map((it,i)=>`<li><span class="n">${i+1}</span><span>${esc(it)}</span></li>`).join('')}</ul>`;
    }
    return '';
  }).join('');
  return `<div class="intro-block">${parts}</div>`;
}

function progressRingSVG(pct, size, stroke){
  size = size || 44; stroke = stroke || 5;
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const offset = c - (pct/100) * c;
  return `
  <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--good)" stroke-width="${stroke}"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"
      transform="rotate(-90 ${size/2} ${size/2})"/>
  </svg>`;
}
</script>
<script>
/* =========================================================================
   WORKBOOK SCREEN
   ========================================================================= */
function renderWorkbook(){
  const track = TRACKS[STATE.currentTrackKey];
  const client = STATE.currentClient;
  const chapter = track.chapters[STATE.currentChapterIdx];
  const overall = computeOverallProgress();
  const overallPct = overall.total ? Math.round(100 * overall.completed / overall.total) : 0;

  const navHTML = track.chapters.map((ch, i) => {
    const p = computeChapterProgress(ch);
    const done = p.total > 0 && p.completed === p.total;
    return `
      <button class="${i === STATE.currentChapterIdx ? 'active' : ''} ${done ? 'done' : ''}" onclick="goToChapter(${i})">
        <span class="chk">${done ? '✓' : ''}</span>
        <span>Ch. ${ch.num} — ${esc(ch.title)}</span>
      </button>`;
  }).join('');

  app.innerHTML = `
    ${topbarHTML({ showSave: true, crumb: `${client.full_name} · ${track.label}` })}
    ${crisisStripHTML()}
    <div class="wrap">
      <button class="btn btn-ghost btn-sm" onclick="backToTrackPicker()">← ${esc(client.full_name)}'s workbooks</button>
      <div class="wb-layout" style="margin-top:16px;">
        <div class="wb-sidebar">
          <div class="progress-ring-wrap">
            ${progressRingSVG(overallPct)}
            <div>
              <div class="pct">${overallPct}%</div>
              <div class="lbl">whole workbook</div>
            </div>
          </div>
          ${foundationBricksHTML()}
          <div class="chapter-nav">${navHTML}</div>
          <div class="wb-tools">
            <button class="btn btn-ghost btn-sm" onclick="openResources()">📋 My Resources &amp; My People</button>
            <button class="btn btn-ghost btn-sm" onclick="openThenNow()">🔍 Then &amp; Now</button>
            <button class="btn btn-ghost btn-sm" onclick="openLetter()">✉️ Letter to My Future Self</button>
            <button class="btn btn-ghost btn-sm" onclick="exportChapterPDF()">⬇ Export this chapter (PDF)</button>
            <button class="btn btn-ghost btn-sm" onclick="window.print()">🖨 Print</button>
            <button class="btn btn-ghost btn-sm" onclick="saveProgressNow(); toast('Saved.')">💾 Save now</button>
          </div>
        </div>
        <div class="wb-main" id="wb-main">
          ${renderChapterBody(chapter)}
        </div>
      </div>
    </div>
    ${siteFooterHTML()}`;
  primeChapterDoneFlags();
  bindWorkbookEvents();
}

function renderChapterBody(chapter){
  const p = computeChapterProgress(chapter);
  let html = `
    <div class="chapter-head">
      <div class="num">CHAPTER ${chapter.num}</div>
      <h2>${esc(chapter.title)}</h2>
      <div class="subtitle">${esc(chapter.subtitle)} · ${p.completed} of ${p.total} sections done</div>
    </div>
    ${renderIntro(chapter.intro)}`;

  if (chapter.prompts && chapter.prompts.length){
    html += chapter.prompts.map(u => renderUnit(chapter, u)).join('');
  }

  if (chapter.specialPrompts){
    html += `
      <div class="section-divider"><div class="line-el"></div><h3>${esc(chapter.specialTitle)}</h3><div class="line-el"></div></div>
      ${chapter.specialHint ? `<p style="color:var(--ink-soft); font-size:13.5px; margin:-6px 0 14px;">${esc(chapter.specialHint)}</p>` : ''}
      ${chapter.specialPrompts.map(u => renderUnit(chapter, u)).join('')}`;
  }

  if (chapter.goals){
    html += `
      <div class="section-divider"><div class="line-el"></div><h3>${esc(chapter.specialTitle)}</h3><div class="line-el"></div></div>
      ${chapter.specialHint ? `<p style="color:var(--ink-soft); font-size:13.5px; margin:-6px 0 14px;">${esc(chapter.specialHint)}</p>` : ''}
      ${renderUnit(chapter, chapter.goals)}`;
  }

  if (chapter.checklist){
    html += renderUnit(chapter, chapter.checklist);
  }

  const track = TRACKS[STATE.currentTrackKey];
  const isFirst = STATE.currentChapterIdx === 0;
  const isLast = STATE.currentChapterIdx === track.chapters.length - 1;
  html += `
    <div class="chapter-footer">
      <button class="btn btn-ghost" ${isFirst ? 'disabled' : ''} onclick="goToChapter(${STATE.currentChapterIdx - 1})">← Previous chapter</button>
      ${!isLast ? `<button class="btn btn-primary" onclick="goToChapter(${STATE.currentChapterIdx + 1})">Next chapter →</button>` : `<button class="btn btn-primary" onclick="finishWorkbook()">Finish for today ✓</button>`}
    </div>`;
  return html;
}

function goToChapter(idx){
  const track = TRACKS[STATE.currentTrackKey];
  if (idx < 0 || idx >= track.chapters.length) return;
  STATE.currentChapterIdx = idx;
  document.getElementById('wb-main').innerHTML = renderChapterBody(track.chapters[idx]);
  primeChapterDoneFlags();
  bindWorkbookEvents();
  window.scrollTo({top:0, behavior:'smooth'});
}

function primeChapterDoneFlags(){
  const track = TRACKS[STATE.currentTrackKey];
  if (!track) return;
  STATE.chapterDoneFlags = STATE.chapterDoneFlags || {};
  track.chapters.forEach(ch => {
    const p = computeChapterProgress(ch);
    STATE.chapterDoneFlags[ch.id] = p.total > 0 && p.completed === p.total;
  });
}

const FOUNDATION_CELEBRATIONS = [
  'Foundation piece laid. 🧱',
  'That layer just got solid. 💪',
  'Nice — another brick in place.',
  'That\'s real progress. Keep going.',
  'One more piece of a strong foundation.'
];

function backToTrackPicker(){
  STATE.currentTrackKey = null;
  STATE.currentVisitId = null;
  STATE.wbTool = null;
  render();
}

function finishWorkbook(){
  saveProgressNow();
  toast('Nice work today — everything is saved.');
  setTimeout(goToDashboard, 900);
}
</script>
<script>
/* =========================================================================
   EVENT DELEGATION — one set of listeners handles every prompt type
   ========================================================================= */
function currentChapterById(chapterId){
  const track = TRACKS[STATE.currentTrackKey];
  return track.chapters.find(c => c.id === chapterId);
}
function currentUnit(chapterId, unitId){
  const chapter = currentChapterById(chapterId);
  if (!chapter) return null;
  return unitsForChapter(chapter).find(u => u.id === unitId);
}

function handleGlobalInputOrChange(e){
  const t = e.target;
  const role = t.dataset.role;
  if (!role) return;

  if (role === 'person-field'){
    setPersonField(t.dataset.pid, t.dataset.field, t.value);
    return;
  }
  if (role === 'care-field'){
    setCareTeamField(t.dataset.pid, t.dataset.field, t.value);
    return;
  }
  if (role === 'resource-check'){
    setResourceShared(t.dataset.resid, t.checked);
    return;
  }
  if (role === 'checkin-field'){
    setCheckinField(t.dataset.eid, t.dataset.field, t.value);
    return;
  }
  if (role === 'checkin-check'){
    setCheckinCheck(t.dataset.eid, t.dataset.item, t.checked);
    return;
  }
  if (role === 'visit-field'){
    setVisitField(t.dataset.vid, t.dataset.field, t.value);
    if (t.dataset.field === 'status'){
      // Status changes the Completed/Upcoming pill on the list view — just
      // update local data here; no full re-render needed while on this page.
    }
    return;
  }
  if (role === 'visit-q-check'){
    toggleVisitQuestionAsked(t.dataset.vid, t.dataset.qid, t.checked);
    return;
  }
  if (role === 'visit-q-text'){
    setVisitQuestionText(t.dataset.vid, t.dataset.qid, t.value);
    return;
  }
  if (role === 'skill-field'){
    setSkillField(t.dataset.sid, t.dataset.field, t.value);
    return;
  }
  if (role === 'rung-field'){
    setRungField(t.dataset.rid, t.dataset.field, t.value);
    return;
  }
  if (role === 'attempt-field'){
    setAttemptField(t.dataset.aid, t.dataset.field, t.value);
    return;
  }
  if (role === 'letter-draft'){
    saveLetterDraft(t.value);
    return;
  }

  const chapterId = t.dataset.chapter;
  const promptId = t.dataset.prompt;

  if (role === 'prompt'){
    setVal(chapterId, promptId, t.value);
  }
  else if (role === 'list-item'){
    const n = parseInt(t.dataset.n, 10);
    const idx = parseInt(t.dataset.idx, 10);
    const arr = (getVal(chapterId, promptId) || new Array(n).fill('')).slice();
    while (arr.length < n) arr.push('');
    arr[idx] = t.value;
    setVal(chapterId, promptId, arr);
  }
  else if (role === 'contact-field'){
    const n = parseInt(t.dataset.n, 10);
    const idx = parseInt(t.dataset.idx, 10);
    const field = t.dataset.field;
    const arr = (getVal(chapterId, promptId) || new Array(n).fill(null).map(()=>({name:'',phone:''}))).map(r => r ? {...r} : {name:'',phone:''});
    while (arr.length < n) arr.push({name:'',phone:''});
    arr[idx][field] = t.value;
    setVal(chapterId, promptId, arr);
  }
  else if (role === 'checklist-item'){
    const n = parseInt(t.dataset.n, 10);
    const idx = parseInt(t.dataset.idx, 10);
    const arr = (getVal(chapterId, promptId) || new Array(n).fill(false)).slice();
    while (arr.length < n) arr.push(false);
    arr[idx] = t.checked;
    setVal(chapterId, promptId, arr);
  }
  else if (role === 'goal-field'){
    const blockKey = t.dataset.blockkey;
    const blockCount = parseInt(t.dataset.blockcount, 10);
    const idx = parseInt(t.dataset.idx, 10);
    const field = t.dataset.field;
    const data = getVal(chapterId, promptId) || {};
    const copy = {};
    Object.keys(data).forEach(k => { copy[k] = (data[k] || []).map(b => b ? {...b} : {goal:'',steps:'',barriers:''}); });
    if (!copy[blockKey]) copy[blockKey] = new Array(blockCount).fill(null).map(()=>({goal:'',steps:'',barriers:''}));
    while (copy[blockKey].length < blockCount) copy[blockKey].push({goal:'',steps:'',barriers:''});
    copy[blockKey][idx][field] = t.value;
    setVal(chapterId, promptId, copy);
  }
  else { return; }

  refreshProgressUI();
}

function refreshProgressUI(){
  const track = TRACKS[STATE.currentTrackKey];
  if (!track) return;
  STATE.chapterDoneFlags = STATE.chapterDoneFlags || {};
  const overall = computeOverallProgress();
  const overallPct = overall.total ? Math.round(100 * overall.completed / overall.total) : 0;
  const ringHost = document.querySelector('.progress-ring-wrap');
  if (ringHost){
    ringHost.innerHTML = `${progressRingSVG(overallPct)}<div><div class="pct">${overallPct}%</div><div class="lbl">whole workbook</div></div>`;
  }
  const navButtons = document.querySelectorAll('.chapter-nav button');
  const brickEls = document.querySelectorAll('.f-brick');
  let justCompleted = null;
  track.chapters.forEach((ch, i) => {
    const p = computeChapterProgress(ch);
    const done = p.total > 0 && p.completed === p.total;
    if (done && !STATE.chapterDoneFlags[ch.id]) justCompleted = ch;
    STATE.chapterDoneFlags[ch.id] = done;

    const btn = navButtons[i];
    if (btn){
      btn.classList.toggle('done', done);
      const chk = btn.querySelector('.chk');
      if (chk) chk.textContent = done ? '✓' : '';
    }
    const brick = brickEls[i]; // bricks render column-reverse, but DOM order matches chapters top-to-bottom in markup
    if (brick) brick.classList.toggle('laid', done);
  });
  const subtitle = document.querySelector('.chapter-head .subtitle');
  if (subtitle){
    const chapter = track.chapters[STATE.currentChapterIdx];
    const p = computeChapterProgress(chapter);
    subtitle.textContent = `${chapter.subtitle} · ${p.completed} of ${p.total} sections done`;
  }
  if (justCompleted){
    const msg = FOUNDATION_CELEBRATIONS[Math.floor(Math.random() * FOUNDATION_CELEBRATIONS.length)];
    toast(msg);
  }
}

function bindWorkbookEvents(){
  // listeners are delegated globally (see initGlobalListeners); nothing per-render to attach.
  refreshProgressUI();
}

function initGlobalListeners(){
  document.addEventListener('input', e => {
    if (e.target.dataset && e.target.dataset.role && e.target.type !== 'checkbox') handleGlobalInputOrChange(e);
  });
  document.addEventListener('change', e => {
    if (e.target.dataset && e.target.dataset.role) handleGlobalInputOrChange(e);
  });
}
</script>
<script>
/* =========================================================================
   EXPORT TO PDF (current chapter) — same pattern as the action plan tool
   ========================================================================= */
async function exportChapterPDF(){
  const track = TRACKS[STATE.currentTrackKey];
  const chapter = track.chapters[STATE.currentChapterIdx];
  const el = document.getElementById('wb-main');
  toast('Preparing PDF…', 4000);
  try {
    const canvas = await html2canvas(el, {
      scale: 2, backgroundColor: '#F3F5F1', useCORS: true,
      onclone: (clonedDoc) => {
        const orig = el.querySelectorAll('input, textarea');
        const clone = clonedDoc.getElementById('wb-main').querySelectorAll('input, textarea');
        orig.forEach((o, i) => {
          const c = clone[i];
          if (!c) return;
          if (o.type === 'checkbox'){ if (o.checked){ c.setAttribute('checked','checked'); c.checked = true; } }
          else if (o.tagName === 'TEXTAREA'){ c.textContent = o.value; c.innerHTML = esc(o.value); }
          else { c.setAttribute('value', o.value); c.value = o.value; }
        });
        const footer = clonedDoc.querySelector('#wb-main .chapter-footer');
        if (footer) footer.style.display = 'none';
      }
    });
    const imgData = canvas.toDataURL('image/jpeg', 0.95);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','pt','letter');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pageWidth;
    const imgHeight = canvas.height * imgWidth / canvas.width;
    let heightLeft = imgHeight, position = 0;
    pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while (heightLeft > 0){
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }
    const clientName = STATE.currentClient.full_name.replace(/\s+/g,'-');
    pdf.save(`Recovery-Workbook-${clientName}-Ch${chapter.num}.pdf`);
  } catch (err){
    console.error(err);
    toast('PDF export ran into an issue — try Print instead.');
  }
}
</script>
<script>
/* =========================================================================
   BOOTSTRAP
   ========================================================================= */
async function init(){
  initGlobalListeners();
  if (!CONFIGURED){ render(); return; }
  const { data } = await sb.auth.getSession();
  if (data && data.session){
    STATE.session = data.session;
    await resolveViewerRole();
  }
  sb.auth.onAuthStateChange((_event, session) => {
    STATE.session = session;
    if (!session){ STATE.viewerRole = null; STATE.currentClient = null; STATE.currentTrackKey = null; render(); }
  });
  render();
}
init();
</script>
